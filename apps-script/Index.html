<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1110">
  <title>BetterMe · Performance Hub</title>
  <style>
    :root{--bg:#0b1110;--surface:#151d19;--surface2:#1c2821;--line:#2a382f;--lime:#c5f46d;--lime2:#a6d752;--text:#f3f7ef;--dim:#9daa9f;--muted:#738479;--amber:#efc574;--radius:18px}
    *,*:before,*:after{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    body:before{content:"";position:fixed;z-index:-1;inset:0;background:radial-gradient(ellipse 60% 28% at 55% 0%,rgba(177,230,87,.09),transparent);pointer-events:none}
    button,input,textarea{font:inherit}
    button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.42;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
    a{text-decoration:none;color:inherit}
    .shell{min-height:100vh;display:flex;max-width:1580px;margin:auto}
    .sidebar{width:252px;flex-shrink:0;padding:32px 19px;display:flex;flex-direction:column;border-right:1px solid #ffffff12;position:sticky;top:0;height:100vh}
    .logo{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:900;letter-spacing:-1.25px}.logo-icon{width:41px;height:41px;background:var(--lime);color:#102015;border-radius:13px;display:grid;place-items:center;font-size:22px}
    .logo em{font-style:normal;color:var(--lime)}.logo small{display:block;font-weight:600;color:var(--muted);font-size:9px;letter-spacing:2.2px;margin-top:-3px}
    .side-cap{font-size:10px;color:var(--muted);letter-spacing:2.6px;font-weight:800;margin:48px 15px 10px}
    .nav-item{display:flex;align-items:center;gap:12px;padding:13px;border-radius:12px;background:transparent;border:0;color:var(--dim);width:100%;text-align:left;font-weight:600}
    .nav-item:hover{background:#ffffff09;color:#fff}.nav-item.active{background:#c5f46d17;color:var(--lime)}
    .nav-symbol{width:24px;text-align:center;font-size:19px}
    .side-bottom{margin-top:auto}.side-cycle{padding:16px;background:linear-gradient(130deg,#1f3021,#18211b);border:1px solid var(--line);border-radius:16px}
    .side-cycle strong{display:block;font-size:28px;line-height:1.3}.side-cycle small{display:block;font-size:11px;color:var(--dim);margin-top:3px}
    .bar{height:7px;border-radius:99px;background:#ffffff13;overflow:hidden}.bar>span{display:block;background:var(--lime);height:100%;border-radius:99px;transition:width .35s ease}
    .side-status{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);margin:15px 8px}
    .status-dot{height:7px;width:7px;border-radius:50%;background:var(--lime)}.status-dot.off{background:var(--amber)}
    main{flex:1;min-width:0;padding:30px 34px 110px}.content{max-width:1100px;margin:auto}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:43px;margin-bottom:28px}
    .topline .mobile-logo{display:none}.top-actions{display:flex;align-items:center;gap:9px}
    .pill{border-radius:99px;padding:8px 12px;border:1px solid var(--line);background:#ffffff06;color:var(--dim);font-size:11px;font-weight:650}
    .pill strong{color:var(--lime)}.icon-btn{border:1px solid var(--line);background:transparent;color:var(--dim);min-width:40px;height:40px;border-radius:12px}
    .icon-btn:hover{color:var(--text);background:#ffffff0a}
    .eyebrow{font-size:10px;color:var(--lime);text-transform:uppercase;font-weight:800;letter-spacing:2.3px}
    h1,h2,h3,p{margin-top:0}h1{font-size:clamp(34px,5vw,56px);font-weight:800;letter-spacing:-2.5px;line-height:1.08;margin:10px 0 13px}h1 .accent{color:var(--lime)}
    h2{font-size:20px;letter-spacing:-.65px;margin:0}h3{font-size:16px;letter-spacing:-.35px;margin:0}
    .lead{color:var(--dim);font-size:14px;max-width:600px;line-height:1.65;margin-bottom:25px}
    .grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:24px 0 15px}.two{grid-template-columns:1.35fr 1fr}.two-equal{grid-template-columns:repeat(2,minmax(0,1fr))}
    .card{background:var(--surface);border:1px solid #ffffff12;border-radius:var(--radius);padding:21px;min-width:0}
    .card.stat{min-height:116px}.card .sub{font-size:12px;color:var(--dim)}.big{font-size:31px;line-height:1.2;font-weight:800;letter-spacing:-1.2px;margin:9px 0 4px}.big small{font-size:13px;font-weight:500;letter-spacing:0;color:var(--dim)}
    .tiny{font-size:11px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:18px}
    .hero{background:radial-gradient(circle at 95% 0%,rgba(197,244,109,.15),transparent 55%),var(--surface);padding:30px}
    .hero h2{font-size:29px;margin:18px 0 8px}.hero p{color:var(--dim);margin-bottom:22px}
    .capsule{display:inline-block;border:1px solid #c5f46d4a;color:var(--lime);background:#c5f46d17;padding:5px 10px;border-radius:99px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.1px}
    .button{border:0;background:var(--lime);color:#102014;font-weight:800;padding:11px 17px;border-radius:12px;min-height:43px;display:inline-flex;gap:9px;align-items:center;justify-content:center}
    .button:hover{background:#d8ffa0}.button.secondary{background:#ffffff0c;color:var(--text);border:1px solid var(--line)}.button.secondary:hover{background:#ffffff14}
    .button.warning{background:#463722;color:#ffe0a2}.button.wide{width:100%}
    .week-days{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.day-small{text-align:center;font-size:10px;color:var(--dim)}
    .day-box{height:52px;display:grid;place-items:center;border-radius:11px;background:#ffffff08;border:1px solid #ffffff0a;color:var(--muted);margin-bottom:6px;font-weight:700}
    .day-box.done{background:#c5f46d25;border-color:#c5f46d70;color:var(--lime)}
    .day-box.partial{background:#eec36b15;border-color:#eec36b50;color:var(--amber)}
    .steps{display:grid;gap:14px}.step{display:flex;gap:12px;align-items:center}.step-icon{width:43px;height:43px;border-radius:11px;background:#ffffff0a;display:grid;place-items:center;color:var(--lime);font-size:19px;flex-shrink:0}
    .step strong{display:block}.step small{color:var(--dim);font-size:11px}
    .week-select{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#ffffff07;border:1px solid var(--line);border-radius:14px;margin:18px 0}
    .week-select strong{display:block;text-align:center}.week-select small{display:block;text-align:center;font-size:11px;color:var(--lime)}
    .day-select{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 21px}.day-select.seven{grid-template-columns:repeat(7,1fr)}
    .day-btn{border:1px solid var(--line);background:#ffffff08;color:var(--dim);border-radius:11px;min-height:43px;font-size:12px;font-weight:700}
    .day-btn.selected{background:var(--lime);color:#102014;border-color:var(--lime)}
    .tag{border:1px solid var(--line);background:#ffffff08;color:var(--dim);padding:4px 10px;border-radius:99px;font-size:11px}
    .tag.green{border-color:#c5f46d50;background:#c5f46d18;color:var(--lime)}.tag.amber{border-color:#efc57440;background:#efc57413;color:var(--amber)}
    .exercise{margin-bottom:12px}.ex-title{display:flex;gap:12px;align-items:flex-start}.ex-num{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#c5f46d17;color:var(--lime);font-weight:800}
    .ex-details{min-width:0;flex:1}.ex-details .eyebrow{font-size:9px;letter-spacing:1.4px;margin-bottom:4px}.ex-details small{color:var(--dim);font-size:12px}
    .set-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:17px 0 13px}
    label{display:block;color:var(--dim);font-size:11px;font-weight:600}
    label span{display:block;margin-bottom:6px}
    input,textarea{width:100%;border:1px solid #ffffff19;background:#ffffff0a;color:var(--text);padding:12px;border-radius:11px;outline:0;min-width:0}
    input:focus,textarea:focus{border-color:#c5f46d9f;box-shadow:0 0 0 2px #c5f46d1c}
    input::placeholder{color:#6e7f72}input[type=number]{text-align:center;font-weight:700}input[type=date]{color-scheme:dark}
    .helper{font-size:11px;color:var(--muted);line-height:1.55}.ex-footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
    .clock{border:1px solid var(--line);background:#101913;border-radius:14px;padding:12px;margin-top:15px}
    .clock-title{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;font-weight:700;color:var(--dim)}
    .presets{display:flex;gap:5px}.preset{font-size:11px;border:1px solid var(--line);background:#ffffff06;color:var(--dim);padding:4px 8px;border-radius:8px}
    .preset.active{color:var(--lime);background:#c5f46d12;border-color:#c5f46d55}
    .clock-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:8px}
    .clock-time{font-size:30px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-1px}
    .clock-status{font-size:11px;color:var(--muted)}.clock-buttons{display:flex;gap:7px;align-items:center}.clock-buttons .button{min-height:36px;padding:7px 11px;font-size:12px}
    .clock-progress{height:4px;background:#ffffff13;border-radius:4px;overflow:hidden;margin-top:11px}.clock-progress span{display:block;height:100%;background:var(--lime);transition:width .25s}
    .clock-finish{margin-top:11px;width:100%}
    .rest-wrap{position:sticky;top:8px;z-index:15;background:#17221a;border-color:#bbed6950;box-shadow:0 10px 30px #0007}
    .inline{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:9px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:16px 0}
    .form-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
    .meal-row{display:flex;gap:13px;padding:15px;border:1px solid var(--line);border-radius:13px;background:#ffffff04;align-items:start}
    .meal-num{width:38px;height:38px;border-radius:11px;background:#c5f46d14;display:grid;place-items:center;color:var(--lime);font-weight:750;flex-shrink:0}
    .meal-row strong{display:block;margin-bottom:3px}.meal-row small{color:var(--dim);display:block;line-height:1.5}
    .meal-click{width:100%;color:inherit;text-align:left;cursor:pointer;transition:border-color .18s,background .18s,transform .18s}
    .meal-click:hover{border-color:#a6d7527a;background:#c5f46d0b}
    .meal-click:active{transform:scale(.994)}
    .meal-click.selected{background:#c5f46d13;border-color:#c5f46d9c;box-shadow:inset 0 0 0 1px #c5f46d30}
    .meal-click.selected .meal-num{background:var(--lime);color:#102014}
    .meal-body{display:block;flex:1;min-width:0}
    .meal-state{margin-left:auto;align-self:center;white-space:nowrap;flex-shrink:0;font-size:11px;font-weight:800;color:var(--muted);padding:5px 8px;border:1px solid var(--line);border-radius:8px}
    .meal-click.selected .meal-state{color:var(--lime);background:#c5f46d1b;border-color:#c5f46d48}
    .meal-progress{margin:0 0 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
    .meal-row b{display:block;font-size:11px;color:var(--lime);margin-top:9px}
    .chart{position:relative;width:100%;height:195px}
    .empty{min-height:170px;border:1px dashed var(--line);border-radius:13px;display:grid;place-items:center;padding:22px;color:var(--muted);text-align:center;font-size:12px}
    .weekly{display:grid;grid-template-columns:repeat(12,1fr);gap:7px}.week-cell{padding:11px 5px;border:1px solid var(--line);background:#ffffff05;border-radius:10px;text-align:center;color:var(--dim)}
    .week-cell.active{border-color:var(--lime);color:var(--lime)}.week-cell strong{font-size:15px;display:block;color:var(--text)}.week-cell small{font-size:10px}
    .notice{padding:14px;border-radius:13px;border:1px solid #c5f46d35;background:#c5f46d0b;color:var(--dim);font-size:12px}
    .notice.warn{background:#efd18a0a;border-color:#e4b86f34}.notice strong{color:var(--text)}
    .save-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:15px}.save-bar p{max-width:550px;color:var(--dim);font-size:11px;margin:0}
    .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#25372b;border:1px solid #4b664e;color:#fff;padding:14px 18px;border-radius:14px;box-shadow:0 20px 45px #0009;width:min(90vw,430px);z-index:99;display:none}
    .toast.show{display:block}.mobile-nav{display:none}
    @media(max-width:1100px){main{padding:25px 20px 100px}.sidebar{width:213px}.stats{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:900px){.sidebar{display:none}.mobile-nav{position:fixed;z-index:40;bottom:0;left:0;right:0;display:flex;justify-content:space-around;gap:3px;background:#0d1610f7;backdrop-filter:blur(18px);padding:8px 5px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
      .mobile-nav button{border:0;background:none;color:var(--muted);display:grid;gap:2px;justify-items:center;font-size:10px;min-width:58px;padding:5px 0;font-weight:650}
      .mobile-nav button.active{color:var(--lime)}.mobile-nav b{font-size:20px;line-height:1.4}
      .topline .mobile-logo{display:flex;font-weight:900;font-size:18px;align-items:center;gap:7px}.mobile-logo span{color:var(--lime)}
      .two{grid-template-columns:1fr 1fr}
    }
    @media(max-width:690px){main{padding:20px 15px 110px}.grid.two,.grid.two-equal{grid-template-columns:1fr}.card{padding:18px}.hero{padding:23px}.weekly{grid-template-columns:repeat(6,1fr)}h1{letter-spacing:-1.7px}.form-grid.four{grid-template-columns:1fr 1fr}.top-actions .pill{font-size:10px;padding:7px 10px}}
    @media(max-width:390px){.stats{gap:8px}.card.stat{padding:12px;min-height:105px}.big{font-size:25px}.day-select.seven{gap:3px}.day-btn{font-size:10px}.presets{flex-wrap:wrap}.clock-time{font-size:25px}.clock-row{gap:7px}}
  </style>
</head>
<body>

  <div id="toast" role="status" class="toast"></div>
<script>
(function(){
  "use strict";
  const DAYS=["Segunda","Terça","Quarta","Quinta","Sexta"];
  const ALL=[...DAYS,"Sábado","Domingo"];
  const STR=["Segunda","Terça","Quinta","Sexta"];
  const BASE_SETS={Segunda:[4,4,3,2,3],Terça:[3,3,3,3,3],Quinta:[4,3,2,3,3],Sexta:[4,3,3,3,3]};
  const WEEK=[
    ["Adaptação",2,25,"Comece com variações confortáveis e execução limpa."],
    ["Adaptação",3,30,"Adicione séries nos movimentos principais."],
    ["Adaptação",3,30,"Consolide repetições com controle."],

  ];
  const EX={
    Segunda:[
      ["Barra fixa pronada","Costas e bíceps",4,4,8,"Pés apoiados ou negativas","Sem balanço. Pare com 1–3 repetições na reserva."],
      ["Flexão tradicional","Peito e tríceps",4,8,15,"Flexão inclinada","Corpo alinhado e descida controlada."],

      ["Prancha frontal","Core",3,30,45,"Prancha com joelhos","Contagem em segundos.",true]
    ],
    Terça:[

      ["Agachamento lento","Quadríceps",3,12,20,"Agachamento livre","Desça em 3 segundos."],
      ["Terra unilateral sem peso","Posterior e equilíbrio",3,8,12,"Terra bilateral","Controle o quadril; por perna."],
      ["Panturrilha","Panturrilhas",3,15,25,"Bilateral com apoio","Sem impulso."],
      ["Dead bug","Core",3,10,12,"Movimento curto","Por lado, sem arquear a lombar."]
    ],
    Quinta:[
      ["Barra fixa supinada","Costas e bíceps",4,4,8,"Com pés apoiados","Palmas voltadas para você."],
      ["Flexão mãos próximas","Peito e tríceps",3,8,12,"Flexão tradicional","Não precisa fazer diamante."],
      ["Sustentação na barra","Costas e pegada",2,10,20,"Negativas controladas","Tempo em segundos.",true],
      ["Flexão pés elevados","Peito e ombros",3,6,12,"Flexão tradicional","Apoio baixo e estável."],
      ["Hollow hold","Core",3,20,40,"Dead bug","Tempo em segundos.",true]
    ],
    Sexta:[
      ["Afundo reverso","Pernas",4,8,12,"Afundo com apoio","Por perna."],
      ["Step-up","Pernas e glúteos",3,8,12,"Degrau baixo","Use degrau fixo e seguro."],
      ["Ponte glúteo unilateral","Glúteos",3,10,15,"Ponte bilateral","Por perna, sem arquear lombar."],
      ["Isometria na parede","Quadríceps",3,30,60,"Isometria mais alta","Tempo em segundos.",true],
      ["Elevação joelhos na barra","Core",3,6,12,"Abdominal reverso","Evite balanço."]
    ]
  };
  const MEALS=[
    ["Café da manhã","3 ovos, pão integral 60 g e banana 100 g",450,25],
    ["Almoço","Arroz 170 g, feijão 150 g, frango 160 g, salada e 10 g de azeite",720,62],
    ["Lanche","Iogurte proteico 170 g, aveia 40 g e maçã",335,20],
    ["Jantar","Carne magra 160 g, batata 180 g, feijão 100 g, legumes e 10 g de azeite",640,50],
    ["Ceia","Leite desnatado 250 ml e castanhas 30 g",270,14]
  ];
  const STORAGE="betterme-gas-data-v1",PENDING="betterme-gas-pending-v1",TIMERS="betterme-gas-clock-v1";
  const blank=()=>({startDate:"2026-11-16",exercises:{},sessions:{},weights:{},nutrition:{},meals:{},measures:{}});
  const readStorage=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))||fallback}catch{return fallback}};
  let state=Object.assign(blank(),readStorage(STORAGE,blank()));
  let queue=readStorage(PENDING,[]);
  let timers={};
  try{timers=JSON.parse(sessionStorage.getItem(TIMERS)||"{}")||{}}catch{}
  const ui={tab:"inicio",week:1,train:"Segunda",food:"Segunda",draft:{},loading:true,saving:false,connected:false};
  const fmt=(x,digits=1)=>Number(x).toLocaleString("pt-BR",{maximumFractionDigits:digits});
  const esc=(x)=>String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const key=(week,day)=>week+":"+day;
  const exKey=(week,day,i)=>week+":"+day+":"+i;
  const today=()=>new Date();
  const startDate=(s)=>new Date((s||"2026-11-16")+"T12:00:00");
  const getWeek=()=>{
    const d=today(),zero=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);
    return Math.max(1,Math.min(12,Math.floor((zero-startDate(state.startDate))/604800000)+1));
  };
  const dateOf=(week,day)=>{const d=startDate(state.startDate);d.setDate(d.getDate()+(week-1)*7+ALL.indexOf(day));return d};
  const weekDone=(week)=>DAYS.filter(d=>(state.sessions[key(week,d)]||{}).status==="Concluído").length;
  const value=(v)=>v==null?"":v;
  const numeric=(s,min,max)=>{
    const raw=String(s||"").trim();if(!raw)return "";
    const n=Number(raw.replace(",","."));
    if(!Number.isFinite(n)||n<min||n>max)throw Error("Insira um número entre "+min+" e "+max+".");
    return n;
  };
  const daysOfWeek=()=>ALL.map(day=>({day,date:dateOf(ui.week,day)}));
  const timeStr=(seconds)=>String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");
  const statusText=(v)=>v==="Concluído"?"Concluído":v==="Parcial"?"Parcial":"Não iniciado";
  const checked=(week,day)=>((state.sessions[key(week,day)]||{}).status||"");
  function toast(msg){
    const el=document.getElementById("toast");
    if(!el)return;el.textContent=msg;el.classList.add("show");
    clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove("show"),4200);
  }
  function saveLocal(){
    try{localStorage.setItem(STORAGE,JSON.stringify(state));localStorage.setItem(PENDING,JSON.stringify(queue));}catch{}
  }
  function rpc(method,data){
    return new Promise((resolve,reject)=>{
      if(!window.google||!google.script||!google.script.run) return reject(new Error("Abra pelo link do Google Apps Script."));
      const run=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      if(method==="getSnapshot")run.getSnapshot();
      else if(method==="saveEntry")run.saveEntry(data);
      else reject(new Error("Método inválido"));
    });
  }
  function mealTotals(ids) {
    return (ids||[]).reduce((totals,id)=>{
      const meal=MEALS[id];
      if(meal){totals.calories+=meal[2];totals.protein+=meal[3]}
      return totals;
    },{calories:0,protein:0});
  }
  function apply(payload){
    const w=payload.week,d=payload.day,k=key(w,d);
    if(payload.type==="workout"){
      payload.entries.forEach(item=>{
        state.exercises[exKey(w,d,item.index)]=item.values.map(v=>v===""?null:v);
      });
      let done=true;
      payload.entries.forEach((item,i)=>{
        const count=Math.min(WEEK[w-1][1],BASE_SETS[d][i]);
        if(item.values.slice(0,count).filter(v=>Number(v)>0).length<count)done=false;
      });
      state.sessions[k]={status:done?"Concluído":"Parcial"};
    }else if(payload.type==="recovery")state.sessions[k]={status:"Concluído"};
    else if(payload.type==="meal"){
      const previous=mealTotals(state.meals[k]||[]);
      const selected=mealTotals(payload.selections);
      const old=state.nutrition[k]||{};
      state.nutrition[k]={
        ...old,
        calories:Math.max(0,(Number(old.calories)||0)-previous.calories+selected.calories),
        protein:Math.max(0,(Number(old.protein)||0)-previous.protein+selected.protein)
      };
      state.meals[k]=[...payload.selections];
    }
    else if(payload.type==="nutrition")state.nutrition[k]={calories:payload.calories,protein:payload.protein,water:payload.water,sleep:payload.sleep};
    else if(payload.type==="weight")state.weights[k]=payload.weight;
    else if(payload.type==="measure")state.measures[String(w)]={waist:payload.waist,pullups:payload.pullups,pushups:payload.pushups,note:payload.note};
    else if(payload.type==="startDate")state.startDate=payload.startDate;
  }
  function queueSave(payload){
    apply(payload);
    const id=payload.type+":"+String(payload.week||"")+":"+String(payload.day||"");
    queue=queue.filter(item=>item.id!==id);
    queue.push({id,payload});
    saveLocal();render();flush();
  }
  async function flush(){
    if(ui.saving||!queue.length)return;
    ui.saving=true;updateConnection();
    while(queue.length){
      const entry=queue[0];
      try{
        const response=await rpc("saveEntry",entry.payload);
        const superseded=queue.some(item=>item!==entry&&item.id===entry.id);
        if(queue[0]===entry)queue.shift();
        else queue=queue.filter(q=>q!==entry);
        if(entry.payload.type==="meal"&&!superseded&&response&&response.selections){
          const k=key(entry.payload.week,entry.payload.day);
          state.meals[k]=response.selections;
          state.nutrition[k]={
            ...(state.nutrition[k]||{}),
            calories:response.calories===""?null:response.calories,
            protein:response.protein===""?null:response.protein
          };
        }
        ui.connected=true;saveLocal();
      }catch(e){
        ui.connected=false;
        toast("Salvo no aparelho; não foi possível sincronizar: "+(e&&e.message?e.message:"erro de conexão"));
        break;
      }
    }
    ui.saving=false;updateConnection();
    if(!queue.length)toast("Salvo na planilha Google.");
  }
  async function load(){
    const weekday=(today().getDay()+6)%7;
    ui.train=DAYS[Math.min(weekday,4)];
    ui.food=ALL[weekday];
    ui.week=getWeek();
    ui.loading=false;render();
    try{
      const incoming=await rpc("getSnapshot");
      state=Object.assign(blank(),incoming);
      queue.forEach(item=>apply(item.payload));
      ui.week=getWeek();ui.connected=true;saveLocal();render();
      if(queue.length)flush();
    }catch(e){ui.connected=false;updateConnection();toast("Acesso à planilha indisponível. Verifique o link e sua conta Google.")}
  }
  async function refresh(){
    if(queue.length){flush();return}
    ui.loading=true;updateConnection();
    try{
      const incoming=await rpc("getSnapshot");
      state=Object.assign(blank(),incoming);ui.connected=true;saveLocal();render();toast("Registros atualizados.");
    }catch(e){ui.connected=false;updateConnection();toast("Não foi possível atualizar os registros.");}
    finally{ui.loading=false;updateConnection();}
  }

  function weightChart(){
    const records=weightRecords();
    if(records.length<2)return '<div class="empty">Registre duas pesagens ou mais para visualizar o gráfico de evolução.</div>';
    const weights=records.map(x=>x.weight),min=Math.min.apply(null,weights)-1,max=Math.max.apply(null,weights)+1;
    const points=records.map((x,i)=>{
      const px=24+Math.round(i*560/(records.length-1)),py=175-Math.round((x.weight-min)*140/(max-min));
      return [px,py];
    });
    const path=points.map(x=>x.join(",")).join(" ");
    const dots=points.map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#c5f46d"><title>'+esc(records[i].weight)+' kg</title></circle>').join("");
    return '<div class="chart"><svg viewBox="0 0 610 210" style="width:100%;height:100%" role="img" aria-label="Evolução do peso em quilogramas">'+

      '<polyline fill="none" stroke="#c5f46d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="'+path+'"/>'+dots+
      '<text x="28" y="20" fill="#a1b8a5" font-size="13">'+fmt(max)+' kg</text>'+
      '<text x="28" y="199" fill="#a1b8a5" font-size="13">'+fmt(min)+' kg</text>'+

  function timerDefault(id,initial){
    if(!timers[id]||!Number.isFinite(timers[id].duration)||timers[id].duration<=0){
      timers[id]={duration:initial,remaining:initial,deadline:0,status:"idle"};
    }
    const t=timers[id];
    if(t.status==="running"){
      t.remaining=Math.max(0,Math.ceil((t.deadline-Date.now())/1000));
      if(!t.remaining)t.status="done";
    }
    return t;
  }
  function timerView(id,title,min,max,log,day,index){
    const t=timerDefault(id,min);
    const options=[...new Set(min===max?[min]:[min,max])];
    if(id==="rest")options.splice(0,options.length,60,90,120,150);
    const presets=options.map(n=>'<button class="preset '+(n===t.duration?"active":"")+'" '+(t.status==="running"?"disabled":"")+' onclick="App.timer(\''+id+'\',\'preset\','+n+')">'+n+'s</button>').join("");
    const controls=t.status==="running"?
      '<button class="button secondary" onclick="App.timer(\''+id+'\',\'pause\')">Ⅱ Pausar</button>':
      '<button class="button" onclick="App.timer(\''+id+'\',\'start\')">▶ '+(t.status==="paused"?"Retomar":"Iniciar")+'</button>';
    const record=log&&t.status==="done"?
      '<button class="button secondary wide clock-finish" onclick="App.recordTimed(\''+day+'\','+index+','+t.duration+')">✓ Registrar '+t.duration+' segundos na próxima série</button>':'';
    return '<div class="clock" data-clock="'+id+'"><div class="clock-title"><span>◷ '+title+'</span><div class="presets">'+presets+'</div></div>'+
      '<div class="clock-row"><div><div class="clock-time" data-time="'+id+'">'+timeStr(t.remaining)+'</div>'+
      '<div class="clock-status" data-status="'+id+'">'+(t.status==="done"?"Tempo concluído!":t.status==="running"?"Contando…":t.status==="paused"?"Pausado":"Pronto")+'</div></div>'+
      '<div class="clock-buttons">'+controls+'<button class="button secondary" onclick="App.timer(\''+id+'\',\'reset\')">↺</button></div></div>'+
      '<div class="clock-progress"><span data-progress="'+id+'" style="width:'+(t.remaining/t.duration*100)+'%"></span></div>'+record+'</div>';
  }

        '<div class="form-grid">'+input("Cintura","waist","cm",record.waist,40,250)+input("Barra fixa","pullups","reps",record.pullups,0,500)+input("Flexões","pushups","reps",record.pushups,0,500)+'</div>'+
        '<label><span>Anotações</span><textarea rows="2" id="measureNote" maxlength="400" placeholder="Como foi esta semana?">'+esc(record.note||"")+'</textarea></label>'+
        '<button class="button wide" style="margin-top:14px" onclick="App.saveMeasure()">✓ Salvar avaliação</button>')+
      '</div>'+
      '<div style="margin-top:22px">'+section("Histórico","As 12 semanas")+
      card('<div class="weekly">'+WEEK.map((w,i)=>'<button class="week-cell '+(ui.week===i+1?"active":"")+'" onclick="App.jumpWeek('+(i+1)+')"><small>SEM</small><strong>'+(i+1)+'</strong><small>'+weekDone(i+1)+'/5</small></button>').join("")+'</div>')+'</div>';
  }
  function config(){
    return '<div class="eyebrow">Configurações</div><h1>Seus dados.<br><span class="accent">Seu controle.</span></h1>'+
      '<p class="lead">Este aplicativo usa o Google Apps Script como hospedagem e a sua planilha como armazenamento. Não precisa de Firebase, Supabase, Cloudflare ou novo login Google a cada treino.</p>'+
      card(section("Conexão","Google Sheets")+
        '<div class="notice"><strong>Acesso privado:</strong> para que apenas você consiga abrir este site, publique o Web App como <b>Executar como: Eu</b> e <b>Quem tem acesso: Somente eu</b>.</div>'+
        '<p class="helper" style="margin-top:15px">Alterações pendentes neste navegador: <strong>'+queue.length+'</strong></p>'+
        '<div class="save-bar"><p>O botão carrega os valores mais recentes da planilha.</p><button class="button secondary" onclick="App.refresh()">↻ Atualizar registros</button></div>')+
      '<div style="margin-top:16px">'+card(section("Plano","Data de início")+
        '<label><span>Escolha uma segunda-feira</span><input id="startDate" type="date" value="'+esc(state.startDate)+'"></label>'+
        '<button class="button" style="margin-top:15px" onclick="App.saveStart()">Salvar início</button>'+
        '<p class="helper" style="margin-top:13px">Dados do plano: 26 anos · 1,79 m · 93 kg · 5 dias por semana · 12 semanas.</p>')+'</div>'+
      '<div class="notice warn" style="margin-top:16px"><strong>Privacidade:</strong> seu registro pode permanecer neste navegador como cópia temporária para carregar rapidamente. Em computadores compartilhados, use um perfil privado do navegador ou limpe os dados locais após o uso.</div>';
  }
  function updateConnection(){
    const el=document.getElementById("sync-status"),side=document.getElementById("side-sync");
    const text=ui.saving?"Sincronizando…":queue.length?"Pendente ("+queue.length+")":ui.connected?"Conectado ao Google":"Modo local";
    const dot=ui.connected&&queue.length===0?"status-dot":"status-dot off";
    if(el)el.innerHTML='<span class="'+dot+'" style="display:inline-block;margin-right:5px"></span>'+esc(text);
    if(side)side.innerHTML='<span class="'+dot+'"></span>'+esc(text);
  }
  function render(){
    const tabContent=ui.tab==="treino"?training():ui.tab==="dieta"?nutrition():ui.tab==="progresso"?progress():ui.tab==="config"?config():overview();
    const total=weekDone(getWeek());
    const main='<div class="sidebar"><div class="logo"><span class="logo-icon">↗</span><span>BETTER<em>ME.</em><small>PERFORMANCE HUB</small></span></div>'+
      '<div class="side-cap">NAVEGAÇÃO</div><nav>'+nav.map(n=>navButton(n,true)).join("")+'</nav>'+
      '<div class="side-bottom"><div class="side-cycle"><div class="eyebrow">Ciclo atual</div><strong>Semana '+getWeek()+'/12</strong>'+bar(getWeek()/12*100)+'<small>'+WEEK[getWeek()-1][0]+' · '+total+'/5 sessões nesta semana</small></div>'+
      '<div class="side-status" id="side-sync"></div></div></div>'+
      '<main><div class="content"><div class="topline"><div class="mobile-logo"><span>↗</span> BETTER<span>ME.</span></div>'+
      '<div class="tiny">Sua jornada, no seu ritmo.</div><div class="top-actions"><button class="icon-btn" title="Atualizar dados" onclick="App.refresh()">↻</button><span class="pill" id="sync-status"></span></div></div>'+tabContent+'</div></main>'+
      '<div class="mobile-nav">'+nav.map(n=>navButton(n,false)).join("")+'</div>';
    document.getElementById("root").innerHTML=main;
    updateConnection();timerTick();
  }
  function navTo(t){
    const allowed=["inicio","treino","dieta","progresso","config"];
    if(!allowed.includes(t))return;
    ui.tab=t;render();window.scrollTo({top:0,behavior:"instant"});
  }
  function setTrain(d){if(DAYS.includes(d)){ui.train=d;render()}}
  function setFood(d){if(ALL.includes(d)){ui.food=d;render()}}
  function changeWeek(step){ui.week=Math.max(1,Math.min(12,ui.week+step));render()}
  function jumpWeek(w){ui.week=Math.max(1,Math.min(12,w));render()}
  function setReps(day,i,slot,raw){
    const k=exKey(ui.week,day,i),sets=[...draftSets(day,i)];
    const v=raw.trim()===""?null:Number(raw);
    sets[slot]=Number.isFinite(v)?v:null;
    ui.draft[k]=sets;
  }
  function saveWorkout(){
    const day=ui.train,week=ui.week,ex=EX[day];
    if(!ex){toast("Selecione um treino de força.");return}
    try {
      const entries=ex.map((item,i)=>{
        const sets=draftSets(day,i),values=[0,1,2,3].map(slot=>{
          const n=sets[slot];
          return n===null||n===undefined||n===""?"":Number(n);
        });
        if(values.some(n=>n!==""&&(!Number.isInteger(n)||n<0||n>900)))throw Error("Séries precisam ter números inteiros válidos.");
        return {index:i,values};
      });
      queueSave({type:"workout",week,day,entries});
      ex.forEach((item,i)=>delete ui.draft[exKey(week,day,i)]);
    }catch(e){toast(e.message)}
  }
  function finishRecovery(){queueSave({type:"recovery",week:ui.week,day:"Quarta"})}
  function readNum(id,min,max){
    const input=document.getElementById(id);return numeric(input?input.value:"",min,max);
  }
  function toggleMeal(index){
    if(!Number.isInteger(index)||index<0||index>=MEALS.length)return;
    const k=key(ui.week,ui.food),previous=state.meals[k]||[];
    const selections=previous.includes(index)
      ?previous.filter(i=>i!==index)
      :[...previous,index].sort((a,b)=>a-b);
    queueSave({type:"meal",week:ui.week,day:ui.food,selections});
  }
  function saveNutrition(){
    try{
      const totals=mealTotals(state.meals[key(ui.week,ui.food)]||[]);
      const rawCalories=readNum("calories",0,10000),rawProtein=readNum("protein",0,1000);
      const calories=rawCalories===""&&totals.calories>0?totals.calories:rawCalories;
      const protein=rawProtein===""&&totals.protein>0?totals.protein:rawProtein;
      if((calories!==""&&calories<totals.calories)||(protein!==""&&protein<totals.protein)){
        throw Error("Desmarque refeições antes de reduzir os totais abaixo do que foi consumido.");
      }
      queueSave({type:"nutrition",week:ui.week,day:ui.food,
        calories,protein,water:readNum("water",0,20),sleep:readNum("sleep",0,24)});
    }catch(e){toast(e.message)}
  }
  function saveWeight(){
    try{const weight=readNum("weight",30,350);
      if(weight==="")return toast("Informe o peso.");
      queueSave({type:"weight",week:ui.week,day:ui.food,weight});
    }catch(e){toast(e.message)}
  }
  function saveMeasure(){
    try{queueSave({type:"measure",week:ui.week,
      waist:readNum("waist",40,250),pullups:readNum("pullups",0,500),
      pushups:readNum("pushups",0,500),note:document.getElementById("measureNote").value.slice(0,400)});
    }catch(e){toast(e.message)}
  }
  function saveStart(){
    const raw=document.getElementById("startDate").value;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(raw)||new Date(raw+"T12:00:00Z").getUTCDay()!==1){
      return toast("A data inicial precisa ser uma segunda-feira.");
    }
    queueSave({type:"startDate",startDate:raw});
    ui.week=getWeek();
  }
  const persistTimers=()=>{try{sessionStorage.setItem(TIMERS,JSON.stringify(timers))}catch{}};
  function timerTick(){
    const now=Date.now();let changed=false;
    for(const id of Object.keys(timers)){
      const t=timers[id];
      if(t.status==="running"){
        const rem=Math.max(0,Math.ceil((t.deadline-now)/1000));
        if(rem!==t.remaining){t.remaining=rem;changed=true}
        if(rem===0){
          t.status="done";changed=true;
          if(navigator.vibrate)try{navigator.vibrate([120,80,120])}catch{}
          if(document.querySelector('[data-clock="'+id+'"]'))setTimeout(render,0);
        }
      }
      const time=document.querySelector('[data-time="'+id+'"]');
      const status=document.querySelector('[data-status="'+id+'"]');
      const bar=document.querySelector('[data-progress="'+id+'"]');
      if(time)time.textContent=timeStr(t.remaining);
      if(status)status.textContent=t.status==="running"?"Contando…":t.status==="done"?"Tempo concluído!":t.status==="paused"?"Pausado":"Pronto";
      if(bar)bar.style.width=String(t.remaining/t.duration*100)+"%";
    }
    if(changed)persistTimers();
  }
  function timer(id,cmd,num){
    const t=timerDefault(id,id==="rest"?90:30);
    if(cmd==="preset"){
      if(t.status!=="running"&&Number.isFinite(num)&&num>=5&&num<=180){
        t.duration=num;t.remaining=num;t.deadline=0;t.status="idle";
      }
    }else if(cmd==="start"){
      const sec=t.status==="paused"&&t.remaining>0?t.remaining:t.duration;
      t.remaining=sec;t.deadline=Date.now()+sec*1000;t.status="running";
    }else if(cmd==="pause"){
      t.remaining=Math.max(0,Math.ceil((t.deadline-Date.now())/1000));
      t.deadline=0;t.status=t.remaining?"paused":"done";
    }else if(cmd==="reset"){
      t.remaining=t.duration;t.deadline=0;t.status="idle";
    }
    persistTimers();render();
  }
  function recordTimed(day,i,seconds){
    const k=exKey(ui.week,day,i),sets=[...draftSets(day,i)];
    const ex=EX[day][i],count=Math.min(ex[2],WEEK[ui.week-1][1]);
    const slot=Array.from({length:count},(_,n)=>n).find(n=>!sets[n]);
    if(slot===undefined)return toast("Todas as séries já estão preenchidas.");
    sets[slot]=seconds;ui.draft[k]=sets;
    const id="ex-"+ui.week+"-"+day+"-"+i;
    if(timers[id]){timers[id].remaining=timers[id].duration;timers[id].status="idle";timers[id].deadline=0;persistTimers()}
    render();toast("Série registrada. Toque em Salvar treino para enviar à planilha.");
  }
  window.App={
    open:navTo,week:changeWeek,jumpWeek,trainDay:setTrain,foodDay:setFood,setRep:setReps,
    saveWorkout,finishRecovery,saveNutrition,toggleMeal,saveWeight,saveMeasure,saveStart,
    timer,recordTimed,refresh
  };
  setInterval(timerTick,250);
  document.addEventListener("visibilitychange",timerTick);
  window.addEventListener("online",flush);
  load();
})();
</script>
</body>
</html>
